name: Deploy backend Worker

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy backend Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_WORKER_NAME" = "garblo"
          test -n "$MONGODB_URI"
          test -n "$OPENAI_API_KEY"
          test -n "$HEALTH_CHECK_TOKEN"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run backend tests
        run: uv run pytest

      - name: Install Python Worker tooling
        run: uv sync --dev

      - name: Deploy Worker
        run: uv run pywrangler deploy --config wrangler.jsonc

      - name: Provision MongoDB Atlas runtime secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MONGODB_URI" | uv run pywrangler secret put MONGODB_URI --config wrangler.jsonc

      - name: Provision OpenAI runtime secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | uv run pywrangler secret put OPENAI_API_KEY --config wrangler.jsonc

      - name: Provision health-check runtime secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HEALTH_CHECK_TOKEN" | uv run pywrangler secret put HEALTH_CHECK_TOKEN --config wrangler.jsonc

      - name: Smoke-test canonical Worker hostname
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 \
            --connect-timeout 10 --max-time 30 \
            -H "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            "https://api.phamtanph.uk/health")"
          printf '%s' "$response" | grep -q '"status"'

      - name: Smoke-test LangChain/OpenAI connectivity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 \
            --connect-timeout 10 --max-time 60 \
            -H "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            -H "X-Health-Token: ${HEALTH_CHECK_TOKEN}" \
            "https://api.phamtanph.uk/health/openai")"
          printf '%s' "$response" | jq -e \
            '.status == "ok" and .provider == "openai" and .model == "gpt-4o-mini"' >/dev/null

      - name: Resolve active deployment metadata
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/deployments"
          deployments="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          printf '%s' "$deployments" | jq -e '.success == true and (.result | type == "array")' >/dev/null
          deployment_id="$(printf '%s' "$deployments" | jq -r '.result[0].id // empty')"
          test -n "$deployment_id"
          printf 'deployment_id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          printf 'Active Cloudflare deployment: %s\n' "$deployment_id"

      - name: Smoke-test commit and deployment metadata URL
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 \
            --connect-timeout 10 --max-time 30 \
            -H "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            -H "X-Health-Token: ${HEALTH_CHECK_TOKEN}" \
            --get "https://api.phamtanph.uk/health/deployment" \
            --data-urlencode "commit_id=${GITHUB_SHA}" \
            --data-urlencode "deployment_id=${DEPLOYMENT_ID}")"
          printf '%s' "$response" | jq -e \
            --arg commit "$GITHUB_SHA" --arg deployment "$DEPLOYMENT_ID" \
            '.status == "ok" and .commit_id == ($commit | ascii_downcase) and .deployment_id == $deployment' >/dev/null
          printf 'Verified commit %s on deployment %s\n' "$GITHUB_SHA" "$DEPLOYMENT_ID"

      - name: Delete non-active historical deployments
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/deployments"
          deployments="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          printf '%s' "$deployments" | jq -e '.success == true and (.result | type == "array")' >/dev/null
          active_id="$(printf '%s' "$deployments" | jq -r '.result[0].id // empty')"
          test -n "$active_id"

          while IFS= read -r deployment_id; do
            test -n "$deployment_id" || continue
            delete_response="$(curl --fail-with-body --silent --show-error --request DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api/$deployment_id")"
            printf '%s' "$delete_response" | jq -e '.success == true' >/dev/null
          done < <(printf '%s' "$deployments" | jq -r --arg active "$active_id" '
            .result[] | select(.id != null and .id != $active) | .id
          ')
