name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build downloadable APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --platforms=android --org com.garblo --project-name garblo .

      - name: Set Android minSdk 23 (flutter_secure_storage 10, CHG-006 G-07)
        run: |
          sed -i -E 's/minSdk(Version)? = flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle
          grep -q "minSdk = 23" android/app/build.gradle

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run derived-query benchmark (TASK-009, 300 ms budget)
        run: flutter test --run-skipped --tags benchmark

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: garblo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
